{% extends "base.html" %}
{% block title %}사용자 서식설정{% endblock %}
{% block page_title %}사용자 서식설정{% endblock %}

{% block content %}
<div class="cs-module-shell">
  <div class="row g-3">
    <div class="col-12 col-xl-7">
      <div class="glass-card">
        <div class="card-header d-flex align-items-center justify-content-between">
          <span><i class="bi bi-type me-2"></i>표시 형식 선택</span>
          <span class="small text-muted">내 계정에만 적용</span>
        </div>
        <div class="p-3">
          <form method="post" action="{{ url_for('settings.formats_index') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="row g-2">
              <div class="col-12 col-md-6">
                <label class="form-label">날짜 형식</label>
                <select name="date_format" class="form-select cs-input">
                  <option value="YYYY-MM-DD" {% if setting.date_format == 'YYYY-MM-DD' %}selected{% endif %}>2026-05-02 (YYYY-MM-DD)</option>
                  <option value="YYYY.MM.DD" {% if setting.date_format == 'YYYY.MM.DD' %}selected{% endif %}>2026.05.02 (YYYY.MM.DD)</option>
                  <option value="MM/DD/YYYY" {% if setting.date_format == 'MM/DD/YYYY' %}selected{% endif %}>05/02/2026 (MM/DD/YYYY)</option>
                </select>
              </div>
              <div class="col-12 col-md-6">
                <label class="form-label">날짜+시간 형식</label>
                <select name="datetime_format" class="form-select cs-input">
                  <option value="YYYY-MM-DD HH:mm" {% if setting.datetime_format == 'YYYY-MM-DD HH:mm' %}selected{% endif %}>2026-05-02 14:35</option>
                  <option value="YYYY.MM.DD HH:mm" {% if setting.datetime_format == 'YYYY.MM.DD HH:mm' %}selected{% endif %}>2026.05.02 14:35</option>
                  <option value="MM/DD/YYYY hh:mm A" {% if setting.datetime_format == 'MM/DD/YYYY hh:mm A' %}selected{% endif %}>05/02/2026 02:35 PM</option>
                </select>
              </div>
              <div class="col-12 col-md-6">
                <label class="form-label">통화 기호</label>
                <select name="currency_symbol" class="form-select cs-input">
                  <option value="원" {% if setting.currency_symbol == '원' %}selected{% endif %}>원</option>
                  <option value="₩" {% if setting.currency_symbol == '₩' %}selected{% endif %}>₩</option>
                  <option value="KRW" {% if setting.currency_symbol == 'KRW' %}selected{% endif %}>KRW</option>
                </select>
              </div>
              <div class="col-12 col-md-6">
                <label class="form-label">숫자 구분기호</label>
                <div class="form-check form-switch mt-2">
                  <input class="form-check-input" type="checkbox" role="switch" id="numberGrouping" name="number_grouping" {% if setting.number_grouping %}checked{% endif %}>
                  <label class="form-check-label" for="numberGrouping">천 단위 콤마 사용</label>
                </div>
              </div>
            </div>
            <div class="mt-3">
              <button type="submit" class="btn btn-primary btn-sm">
                <i class="bi bi-save me-1"></i>서식설정 저장
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <div class="col-12 col-xl-5">
      <div class="glass-card h-100">
        <div class="card-header"><i class="bi bi-eye me-2"></i>미리보기</div>
        <div class="p-3">
          <div class="mb-2"><strong>날짜:</strong> {{ sample_date }}</div>
          <div class="mb-2"><strong>날짜+시간:</strong> {{ sample_datetime }}</div>
          <div class="mb-0"><strong>금액:</strong> {{ sample_currency }}</div>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
